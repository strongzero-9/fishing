<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Line Boy">
<meta name="theme-color" content="#2e2e3a">
<title>Line Boy: fishing line converter</title>
<style>
:root{--body:#cfcbbd;--bez:#5b5b70;--lcd:#9bbc0f;--ink:#0f380f;--blue:#3a3f8f;--mag:#a2204f;--dk:#26262e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:#2e2e3a;display:flex;align-items:center;justify-content:center;font-family:"Courier New",ui-monospace,Menlo,monospace;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.gb{position:relative;width:min(94vw,390px);margin:12px auto;background:var(--body);border-radius:14px 14px 56px 14px;padding:18px 18px 34px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),inset 3px 3px 0 rgba(255,255,255,.35),0 10px 30px rgba(0,0,0,.5)}
.bz{background:var(--bez);border-radius:10px 10px 38px 10px;padding:10px 20px 8px}
.bzt{color:#c9c9d8;font-size:.62rem;letter-spacing:.12em;text-align:center;margin-bottom:6px}
.lcd{background:var(--lcd);color:var(--ink);border-radius:3px;padding:10px 12px;min-height:210px;box-shadow:inset 0 3px 8px rgba(15,56,15,.45);display:flex;flex-direction:column;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:7px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font:inherit;font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:4px 9px;min-height:32px;border:2px solid var(--ink);border-radius:2px;background:transparent;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--lcd)}
#units{margin-top:9px}
.cap{font-size:.55rem;letter-spacing:.05em;color:var(--blue);font-weight:700;text-align:center;margin-top:7px;white-space:nowrap}
.mv{display:flex;align-items:baseline;gap:8px;margin-top:10px}
#main{flex:1;min-width:0;width:100%;font:inherit;font-size:2.5rem;line-height:1.1;background:transparent;border:0;border-radius:0;padding:0;color:var(--ink);outline:0;-webkit-appearance:none;appearance:none}
#main:focus{background:rgba(15,56,15,.15)}
#unit{font-size:1.1rem}
#r2{font-size:1.3rem;margin-top:6px}
#r3{font-size:1rem;margin-top:2px}
#msg{margin-top:auto;padding-top:8px;font-size:.66rem;letter-spacing:.04em;min-height:1.9em;line-height:1.25}
.brand{margin:10px 0 0 6px;color:var(--blue);font-weight:700;font-style:italic;font-size:1.15rem}
.brand small{font-size:.6rem;font-style:normal;letter-spacing:.1em;margin-left:6px}
.ctl{display:flex;justify-content:space-between;align-items:center;padding:22px 4px 0}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dp{display:grid;grid-template:repeat(3,50px)/repeat(3,50px)}
.dp button{background:var(--dk);color:#777;font-size:1rem;padding:0}
.dp button:active{background:#000;color:#ccc}
.dp i{grid-area:2/2;background:var(--dk)}
#up{grid-area:1/2;border-radius:8px 8px 0 0}#dn{grid-area:3/2;border-radius:0 0 8px 8px}
#lf{grid-area:2/1;border-radius:8px 0 0 8px}#rt{grid-area:2/3;border-radius:0 8px 8px 0}
.ab{position:relative;width:138px;height:100px;transform:rotate(-25deg)}
.ab button{position:absolute;top:10px;width:58px;height:58px;border-radius:50%;background:var(--mag);box-shadow:0 3px 0 #6d1235;color:rgba(255,255,255,.65);font-weight:700;font-size:1rem}
.ab button:active{transform:translateY(2px);box-shadow:0 1px 0 #6d1235}
.ab span,.sb span{position:absolute;white-space:nowrap;color:var(--blue);font-weight:700;font-size:.8rem}
.ss{display:flex;justify-content:center;gap:8px;margin-top:30px;transform:rotate(-25deg);padding-right:40px}
.sb{position:relative;width:88px;height:34px}
.sb button{width:56px;height:14px;border-radius:8px;background:#8a8a8a;box-shadow:0 2px 0 #62625a}
.sb span{top:18px;left:0;font-size:.55rem;letter-spacing:.06em}
.grill{position:absolute;right:26px;bottom:24px;width:62px;height:44px;background:repeating-linear-gradient(-65deg,#a8a496 0 5px,transparent 5px 11px);transform:rotate(-25deg) skewX(-5deg)}
.panel{margin:18px 2px 44px;padding:12px 14px;background:rgba(0,0,0,.07);border-radius:10px}
.slh{display:flex;justify-content:space-between;align-items:baseline;color:var(--blue);font-weight:700;font-size:.72rem;letter-spacing:.08em}
.cap2{font-size:.58rem;font-weight:400;letter-spacing:0}
#sz{-webkit-appearance:none;appearance:none;display:block;width:100%;height:40px;margin:2px 0 0;background:transparent}
#sz::-webkit-slider-runnable-track{height:10px;background:var(--dk);border-radius:5px}
#sz::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-13px;border-radius:50%;background:var(--mag);border:0;box-shadow:0 3px 0 #6d1235}
#sz::-moz-range-track{height:10px;background:var(--dk);border-radius:5px}
#sz::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:var(--mag);border:0;box-shadow:0 3px 0 #6d1235}
.ends{display:flex;justify-content:space-between;font-size:.62rem;font-weight:700;color:var(--blue)}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.sws{display:flex;flex-direction:column;gap:12px}
.sw{display:flex;align-items:center;gap:8px;font-size:.62rem;font-weight:700;color:var(--blue);letter-spacing:.05em}
.sw input{-webkit-appearance:none;appearance:none;position:relative;margin:0;width:58px;height:32px;border-radius:16px;background:#8a8a8a;box-shadow:inset 0 2px 3px rgba(0,0,0,.4);cursor:pointer}
.sw input::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#ecead9;box-shadow:0 2px 0 rgba(0,0,0,.3);transition:left .15s}
.sw input:checked{background:var(--blue)}
.sw input:checked::after{left:30px}
.sw input:disabled{opacity:.45}
.sw input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.abw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.58rem;font-weight:700;color:var(--blue);letter-spacing:.05em}
.abtn{width:62px;height:62px;border-radius:50%;background:var(--mag);box-shadow:0 3px 0 #6d1235;color:rgba(255,255,255,.65);font-weight:700;font-size:1.1rem}
.abtn:active{transform:translateY(2px);box-shadow:0 1px 0 #6d1235}
.tri{display:flex;background:#8a8a8a;border-radius:18px;padding:3px;box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.tb{background:transparent;color:#2b2b33;font-size:.58rem;font-weight:700;letter-spacing:.03em;padding:0 9px;min-height:32px;border-radius:15px}
.tb.on{background:#ecead9;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tri.off{opacity:.45;pointer-events:none}
.dial{position:relative;width:186px;height:186px;margin:6px auto 0;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;border-radius:50%}
.dial:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
#tk{position:absolute;inset:0;width:100%;height:100%;stroke:var(--blue);stroke-width:3;stroke-linecap:round}
.knob{position:absolute;inset:26px;border-radius:50%;background:repeating-conic-gradient(#3a3a46 0 5deg,#26262e 5deg 10deg);box-shadow:0 4px 0 #14141a,0 0 0 3px #1c1c22;transition:transform .12s}
.dial.drag .knob{transition:none}
.knob::after{content:"";position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5b5b6c,#33333d);box-shadow:inset 0 2px 3px rgba(255,255,255,.12)}
.knob i{position:absolute;left:50%;top:6px;width:7px;height:24px;margin-left:-3.5px;border-radius:4px;background:var(--mag);z-index:1}
.dial span{position:absolute;bottom:2px;font-size:.62rem;font-weight:700;color:var(--blue)}
#e0{left:2px}#e1{right:2px}
.bar{display:flex;justify-content:space-between;align-items:center}
.sticker{width:112px;height:80px;margin-right:2px;transform:rotate(-8deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
</style>
</head>
<body>
<div class="gb">
<div class="bz">
<div class="bzt">&#9664; LINE CONVERTER &#9654;</div>
<div class="lcd">
<div class="top"><div class="chips"><button class="chip" id="tL">LINE</button><button class="chip" id="tW">WEIGHT</button></div><button class="chip" id="tT">PE BRAID</button></div>

<div class="mv"><input id="main" type="number" inputmode="decimal" step="any" min="0" aria-label="Value"><span id="unit">GOU</span></div>

</div>
<div class="bar"><div class="brand">Line Boy<small>JP &#10132; US</small></div><svg class="sticker" viewBox="-6 -14 148 106" role="img" aria-label="Giant trevally (ulua) sticker"><defs><linearGradient id="ug" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5664"/><stop offset=".45" stop-color="#9cb2bb"/><stop offset="1" stop-color="#eef3f1"/></linearGradient></defs><g transform="translate(0 0)"><g fill="#fff" stroke="#fff" stroke-width="9" stroke-linejoin="round"><path d="M5 47 C7 36 11 23 24 15 C44 5 70 10 90 26 C96 30 102 37 108 40 C115 31 124 20 134 10 C127 24 122 34 120 44 C122 54 127 66 134 78 C124 71 115 58 108 48 C100 58 84 66 60 70 C38 72 17 67 10 57 C6 53 5 50 5 47 Z"/><path d="M32 14 L35 4 L39 10 L43 2 L47 9 L52 3 L56 9 L61 4 L65 12 C54 8 42 9 32 14 Z"/><path d="M64 12 C63 0 70 -9 77 -8 C80 3 94 16 106 36 L98 36 C86 22 74 14 64 12 Z"/><path d="M66 68 C64 78 69 85 76 85 C80 76 96 62 106 50 L98 50 C88 58 76 64 66 68 Z"/><path d="M34 45 C52 46 68 58 78 72 C62 61 46 55 34 50 Z"/><path d="M44 67 L49 77 L57 70 Z"/></g><g stroke="#2d4350" stroke-width="1.2" stroke-linejoin="round"><path d="M32 14 L35 4 L39 10 L43 2 L47 9 L52 3 L56 9 L61 4 L65 12 C54 8 42 9 32 14 Z" fill="#47616f"/><path d="M64 12 C63 0 70 -9 77 -8 C80 3 94 16 106 36 L98 36 C86 22 74 14 64 12 Z" fill="#4e6a78"/><path d="M66 68 C64 78 69 85 76 85 C80 76 96 62 106 50 L98 50 C88 58 76 64 66 68 Z" fill="#5a7684"/><path d="M44 67 L49 77 L57 70 Z" fill="#dfe8e6"/><path d="M5 47 C7 36 11 23 24 15 C44 5 70 10 90 26 C96 30 102 37 108 40 C115 31 124 20 134 10 C127 24 122 34 120 44 C122 54 127 66 134 78 C124 71 115 58 108 48 C100 58 84 66 60 70 C38 72 17 67 10 57 C6 53 5 50 5 47 Z" fill="url(#ug)"/><path d="M34 45 C52 46 68 58 78 72 C62 61 46 55 34 50 Z" fill="#46606d"/></g><path d="M12 56 C24 67 44 71 64 69 C82 65 98 57 108 48 C94 56 76 61 56 61 C36 61 20 59 12 56 Z" fill="#f6f9f7" opacity=".7"/><path d="M32 27 C52 25 78 32 96 42 L108 44" fill="none" stroke="#5f7886" stroke-width="1"/><g stroke="#2d4350" stroke-width="1.3" stroke-linecap="round"><line x1="94" y1="39" x2="94" y2="45"/><line x1="97" y1="40" x2="97" y2="46"/><line x1="100" y1="40.5" x2="100" y2="46.5"/><line x1="103" y1="41" x2="103" y2="47"/><line x1="106" y1="41.5" x2="106" y2="47.5"/><path d="M57 70 L58 76 M61 69 L62 78" fill="none"/></g><path d="M30 22 C39 32 41 52 33 65" fill="none" stroke="#2d4350" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="33.5" cy="33" rx="2" ry="3" fill="#18262f"/><g fill="#2d4350" opacity=".7"><circle cx="48" cy="20" r="1.1"/><circle cx="58" cy="22" r="1.1"/><circle cx="68" cy="26" r="1.1"/><circle cx="54" cy="30" r="1.1"/><circle cx="76" cy="32" r="1.1"/><circle cx="44" cy="28" r="1.1"/></g><circle cx="17" cy="35" r="4.2" fill="#f1ecd0" stroke="#2d4350" stroke-width="1"/><circle cx="16.4" cy="35" r="2.3" fill="#10202a"/><path d="M5 49 C13 53 22 55 29 52" fill="none" stroke="#1d2d38" stroke-width="2.2" stroke-linecap="round"/></g></svg></div>
<div class="panel">
<div class="slh"><span>SIZE</span><span class="cap2">turn the wheel, or tap the number to type</span></div>
<div class="dial" id="dial" role="slider" tabindex="0" aria-label="Size" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><svg id="tk" viewBox="-100 -100 200 200" aria-hidden="true"></svg><div class="knob" id="knob"><i></i></div><span id="e0"></span><span id="e1"></span></div>
<div class="row2">
<div class="sws">
<label class="sw"><span>LINE</span><input id="swM" type="checkbox" role="switch" aria-label="Weight mode"><span>WEIGHT</span></label>
<div class="tri" id="tri" role="radiogroup" aria-label="Line type"><button class="tb" data-t="pe">PE</button><button class="tb" data-t="ny">NYLON</button></div>
</div>
<div class="abw"><button id="bA" class="abtn" aria-label="Scan label">A</button><span>SCAN LABEL</span></div>
</div>
</div>
<div class="grill"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
</div>
<script>
var D={
pe:[[0.2,4,0.074],[0.3,5,0.09],[0.4,6,0.104],[0.6,8,0.128],[0.8,12,0.148],[1,16,0.165],[1.2,20,0.185],[1.5,25,0.205],[2,32,0.235],[2.5,40,0.26],[3,48,0.29],[4,60,0.33],[5,72,0.37],[6,85,0.4],[8,100,0.47],[10,130,0.52]],
ny:[[0.4,1.5,0.104],[0.6,2.5,0.128],[0.8,3,0.148],[1,4,0.165],[1.5,6,0.205],[2,8,0.235],[3,12,0.285],[4,16,0.33],[5,20,0.37],[6,25,0.405],[8,30,0.47],[10,40,0.52],[12,50,0.57],[16,60,0.66],[20,80,0.74]]
};
var PRE=[1,1.8,3.5,5,7,10,14,21,28,35,42,56,84];
var WF={g:1,oz:28.3495,gou:3.75},WD={g:2,oz:3,gou:2},WU={g:'G',oz:'OZ',gou:'GOU'};
var S={mode:'line',type:'pe',src:'gou',v:1,g:3.75,w:'g'};
var $=function(i){return document.getElementById(i)};
function R(x,d){var p=Math.pow(10,d);return Math.round(x*p)/p}
function cl(x,a,b){return Math.min(b,Math.max(a,x))}
function interp(t,f,to,x){
 var r=D[t],i=0,a,b;
 if(x<=r[0][f]){a=r[0];b=r[1]}
 else if(x>=r[r.length-1][f]){a=r[r.length-2];b=r[r.length-1]}
 else{for(i=0;i<r.length-1;i++){if(x>=r[i][f]&&x<=r[i+1][f])break}a=r[i];b=r[i+1]}
 return Math.max(0,a[to]+(x-a[f])/(b[f]-a[f])*(b[to]-a[to]));
}
var hint='TURN THE WHEEL OR TAP THE NUMBER',ft=0,sig='';
function flash(t,ms){clearTimeout(ft);$('msg').textContent=t;if(ms!==0)ft=setTimeout(function(){$('msg').textContent=hint},ms||3500)}
function lv(){var g,l;if(S.src==='gou'){g=S.v;l=interp(S.type,0,1,g)}else{l=S.v;g=interp(S.type,1,0,l)}return{gou:g,lb:l}}
function render(skip){
 var a,b,t,u,v;
 if(S.mode==='line'){
  var x=lv();t='LINE '+(S.type==='pe'?'PE':'NYLON');u=S.src==='gou'?'GOU':'LB';v=S.v;
  a=S.src==='gou'?'= '+R(x.lb,1)+' LB':'= '+R(x.gou,2)+' GOU';
  b=R(x.lb*0.4536,1)+' KG  '+R(interp(S.type,1,2,x.lb),3)+' MM';
 }else{
  t='WEIGHT';u=WU[S.w];v=R(S.g/WF[S.w],WD[S.w]);
  var o=['g','oz','gou'].filter(function(k){return k!==S.w});
  a='= '+R(S.g/WF[o[0]],WD[o[0]])+' '+WU[o[0]];
  b='= '+R(S.g/WF[o[1]],WD[o[1]])+' '+WU[o[1]];
 }
 chips();syncUI();$('unit').textContent=u;$('r2').textContent=a;$('r3').textContent=b;
 if(!skip)$('main').value=R(v,3);
}
function setUnit(k){
 if(S.mode==='line'){
  if(k===S.src)return;
  var x=lv();
  if(k==='lb'){S.src='lb';S.v=R(x.lb,1)}else{S.src='gou';S.v=R(x.gou,2)}
 }else S.w=k;
 render();
}
function chips(){
 var line=S.mode==='line',cur=line?S.src:S.w;
 $('tL').classList.toggle('on',line);$('tW').classList.toggle('on',!line);
 $('tT').textContent=TN[S.type];
 $('tT').style.visibility=line?'visible':'hidden';
 var key=S.mode+cur;
 if(key===sig)return;
 sig=key;
 var us=line?[['gou','GOU'],['lb','LB']]:[['g','G'],['oz','OZ'],['gou','GOU']];
 $('units').innerHTML='';
 us.forEach(function(q){
  var b=document.createElement('button');
  b.className='chip'+(q[0]===cur?' on':'');b.textContent=q[1];
  b.onclick=function(){setUnit(q[0])};
  $('units').appendChild(b);
 });
}
var TN={pe:'PE BRAID',ny:'NYLON'};
function typ(){if(S.mode!=='line')return;S.type=S.type==='pe'?'ny':'pe';render();flash(TN[S.type]+' LINE')}
function mode(){S.mode=S.mode==='line'?'wt':'line';render();flash(S.mode==='line'?'LINE MODE':'WEIGHT MODE')}
var dial=$('dial'),knob=$('knob'),DI=0,NT=0,dang=-135,drag=false,lastA=0;
function list(){return S.mode==='line'?D[S.type].map(function(r){return S.src==='gou'?r[0]:r[1]}):PRE}
function angOf(k,n){return -135+k/(n-1)*270}
function ticks(n){
 if(n===NT)return;NT=n;
 var h='';
 for(var k=0;k<n;k++){var a=angOf(k,n)*Math.PI/180,sn=Math.sin(a),cs=-Math.cos(a);h+='<line x1="'+(sn*80).toFixed(1)+'" y1="'+(cs*80).toFixed(1)+'" x2="'+(sn*92).toFixed(1)+'" y2="'+(cs*92).toFixed(1)+'"/>'}
 $('tk').innerHTML=h;
}
function syncUI(){
 var l=list(),n=l.length,v=S.mode==='line'?S.v:S.g,k=0,best=1e9;
 l.forEach(function(x,q){var d=Math.abs(Math.log(x/v));if(d<best){best=d;k=q}});
 DI=k;ticks(n);
 if(!drag){dang=angOf(k,n);knob.style.transform='rotate('+dang+'deg)'}
 var f=function(x){return S.mode==='line'?x:R(x/WF[S.w],WD[S.w])};
 dial.setAttribute('aria-valuemax',n-1);dial.setAttribute('aria-valuenow',k);dial.setAttribute('aria-valuetext',String(f(l[k])));
 $('e0').textContent=f(l[0]);$('e1').textContent=f(l[n-1]);
 $('swM').checked=S.mode!=='line';
 document.querySelectorAll('.tb').forEach(function(b){var on=b.getAttribute('data-t')===S.type;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
 $('tri').classList.toggle('off',S.mode!=='line');
}
function setIdx(k){var v=list()[k];if(S.mode==='line')S.v=v;else S.g=v;render()}
function step(d){var n=list().length,k=cl(DI+d,0,n-1);if(k!==DI)setIdx(k)}
function pang(e){var r=dial.getBoundingClientRect();return Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI}
dial.addEventListener('pointerdown',function(e){e.preventDefault();try{dial.setPointerCapture(e.pointerId)}catch(x){}drag=true;dial.classList.add('drag');lastA=pang(e);dial.focus()});
dial.addEventListener('pointermove',function(e){
 if(!drag)return;
 var a=pang(e),d=a-lastA;
 while(d>180)d-=360;while(d<-180)d+=360;
 lastA=a;dang=cl(dang+d,-135,135);
 knob.style.transform='rotate('+dang+'deg)';
 var n=list().length,k=Math.round((dang+135)/270*(n-1));
 if(k!==DI)setIdx(k);
});
function endDrag(){if(!drag)return;drag=false;dial.classList.remove('drag');syncUI()}
dial.addEventListener('pointerup',endDrag);dial.addEventListener('pointercancel',endDrag);
dial.addEventListener('keydown',function(e){
 var k=e.key,d=(k==='ArrowUp'||k==='ArrowRight')?1:(k==='ArrowDown'||k==='ArrowLeft')?-1:0;
 if(d){e.preventDefault();step(d)}
});
dial.addEventListener('wheel',function(e){e.preventDefault();step(e.deltaY<0?1:-1)},{passive:false});
$('swM').onchange=function(){S.mode=this.checked?'wt':'line';render();flash(S.mode==='line'?'LINE MODE':'WEIGHT MODE')};
document.querySelectorAll('.tb').forEach(function(b){b.onclick=function(){S.type=b.getAttribute('data-t');render();flash(TN[S.type])}});
$('tL').onclick=function(){if(S.mode!=='line')mode()};
$('tW').onclick=function(){if(S.mode==='line')mode()};
$('tT').onclick=typ;

 var v=parseFloat(this.value);if(!(v>0))return;
 if(S.mode==='line')S.v=v;else S.g=v*WF[S.w];

/* label scan: Claude when hosted on claude.ai, otherwise in-browser OCR */
var cam=$('cam'),loading=null;
$('bA').onclick=function(){cam.click()};
function loadLib(){
 if(window.Tesseract)return Promise.resolve();
 if(!loading)loading=new Promise(function(res,rej){
  var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  sc.onload=res;sc.onerror=function(){loading=null;rej(new Error('load'))};document.head.appendChild(sc);
 });
 return loading;
}
function prep(file,max,gray){return new Promise(function(res,rej){
 var img=new Image(),u=URL.createObjectURL(file);
 img.onload=function(){
  var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  if(gray)try{
   var d=x.getImageData(0,0,c.width,c.height),p=d.data;
   for(var i=0;i<p.length;i+=4){var g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];g=(g-128)*1.5+128;p[i]=p[i+1]=p[i+2]=g<0?0:g>255?255:g}
   x.putImageData(d,0,0);
  }catch(e){}
  res(c);
 };
 img.onerror=function(){rej(new Error('img'))};img.src=u;
})}
function ok(v){return v>=0.1&&v<=30}
function parse(t){
 t=t.replace(/(\d),(\d)/g,'$1.$2');
 var o={type:null,gou:null,lb:null};
 if(/\bPE\b|braid|\bX[48]\b|\bWX/i.test(t))o.type='pe';else if(/nylon|fluoro|carbon|\bFC\b|mono/i.test(t))o.type='ny';
 var re=[/(\d+(?:\.\d+)?)\s*(?:gou|go\b|\u53f7)/i,/\bPE\s*(?:No\.?|#)?\s*(\d+(?:\.\d+)?)/i,/\bNo\.?\s*(\d+(?:\.\d+)?)/i];
 for(var i=0;i<re.length&&o.gou===null;i++){var m=re[i].exec(t);if(m&&ok(parseFloat(m[1])))o.gou=parseFloat(m[1])}
 var lm=/(\d+(?:\.\d+)?)\s*-?\s*(?:lbs?|ibs?)\b/i.exec(t);
 if(lm)o.lb=parseFloat(lm[1]);else{var km=/(\d+(?:\.\d+)?)\s*kg/i.exec(t);if(km)o.lb=R(parseFloat(km[1])*2.2046,1)}
 return o;
}
async function viaClaude(f){
 var sm=await claude.use('sample');if(!sm)return null;
 var lim=await sm.limits();if(!lim||!lim.images)return null;
 var c=await prep(f,1400,false),b=await new Promise(function(r){c.toBlob(r,'image/jpeg',0.85)});
 return await sm.json('This is a photo of a fishing line package or spool label. Find the line size and strength. Reply with ONLY JSON: {"type":"pe" or "ny" (pe for braided PE line, ny for nylon, fluorocarbon or mono), "gou": number or null (the Japanese size in gou), "lb": number or null (pound test)}. Use null for anything not printed on the label. If only kg is shown, convert to lb (1 kg = 2.2046 lb). No other text.',{images:[b],modelTier:'quick'});
}
async function viaOcr(f){
 await loadLib();
 var c=await prep(f,1800,true);
 var r=await Tesseract.recognize(c,'eng',{logger:function(g){if(g.status==='recognizing text')flash('READING '+Math.round(g.progress*100)+'%',0)}});
 return parse((r.data&&r.data.text)||'');
}
cam.addEventListener('change',async function(){
 var f=cam.files&&cam.files[0];if(!f)return;
 flash('LOADING...',0);
 var o=null;
 try{if(window.claude)o=await viaClaude(f)}catch(e){if(e&&e.code==='not_granted'){flash('ALLOW PHOTO ACCESS, TRY AGAIN');cam.value='';return}}
 if(!o){try{o=await viaOcr(f)}catch(e){flash(e&&e.message==='load'?'NEEDS INTERNET TO READ':'COULD NOT READ PHOTO');cam.value='';return}}
 var g=parseFloat(o&&o.gou),l=parseFloat(o&&o.lb);
 if(o&&(o.type==='pe'||o.type==='ny'))S.type=o.type;
 if(g>0){S.mode='line';S.src='gou';S.v=g;render();flash('READ '+g+' GOU. CHECK PACKAGE')}
 else if(l>0){S.mode='line';S.src='lb';S.v=l;render();flash('READ '+l+' LB. CHECK PACKAGE')}
 else flash('NO SIZE FOUND. TYPE IT IN');
 cam.value='';
});
